name: Flask CI/CD Pipeline
on:
  push:
    branches:
      - victor
  pull_request:
    branches:
      - master
env:
  IMAGE_NAME: flask-test-ci-cd
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Linter
        run: |
          flake8 digicheese tests

      - name: Run tests
        run: |
          pytest ---maxfail=1 --disable-warnings digicheese && pylint digicheese